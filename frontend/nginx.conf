# Resolver for DNS resolution (required for proxy_pass with variables)
# Use Docker's internal DNS (127.0.0.11) first, then fallback to Google DNS
resolver 127.0.0.11 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend
    # Remove /api prefix and forward to backend
    location ~ ^/api/(.*)$ {
        # Use variable to capture backend URL
        set $backend $BACKEND_URL;
        set $path $1;
        
        # Proxy to backend with rewritten path
        # When using variable in proxy_pass, we need to construct the full URL
        proxy_pass $backend/$path$is_args$args;
        
        # HTTP version and headers
        proxy_http_version 1.1;
        # For HTTPS backends, proxy_ssl_server_name will set the correct Host
        # For HTTP backends, use the original host (Docker will resolve service names)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        
        # SSL settings (if backend uses HTTPS)
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify off;
        
        # Don't add CORS headers here - backend handles CORS
        # This prevents CORS header conflicts
        
        # Timeout and buffering settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        
        # Error handling
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
    
    # Handle /api without path (redirect to /api/)
    location = /api {
        return 301 /api/;
    }
    
    # Handle /api/ without path (proxy to backend root)
    location = /api/ {
        set $backend $BACKEND_URL;
        proxy_pass $backend/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify off;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
